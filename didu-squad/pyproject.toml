[project]
name = "ers"
version = "0.1.0"
description = "Multi-agent emergency response coordination simulator (CSYE7380 mid-term)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "openai-agents>=0.3",
    "pydantic>=2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "streamlit>=1.40",
    "plotly>=5.24",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
